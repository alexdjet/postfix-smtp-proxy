#version: '2'
services:
  mail-server:
    build: .
    container_name: mail-proxy
    volumes:
      - ./var/spool/postfix:/var/spool/postfix:rw
    privileged: true
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 77.88.8.1
      - 77.88.8.8
    ports:
      - "8025:25"
      - "8587:587"